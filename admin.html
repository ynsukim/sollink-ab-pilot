<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOL LINK AB Test — Admin</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { background: #f5f7fb; }
    .admin-wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
    .admin-card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .stat { background: #f0f4fa; border-radius: 8px; padding: 12px; }
    .stat strong { display: block; font-size: 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 8px; text-align: left; vertical-align: top; }
    th { background: #f9fafb; position: sticky; top: 0; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .toolbar button, .toolbar input { padding: 8px 12px; border-radius: 8px; border: 1px solid #d0d5dd; }
    .toolbar button { background: #2571fe; color: #fff; border: none; cursor: pointer; }
    pre { white-space: pre-wrap; font-size: 11px; max-height: 120px; overflow: auto; background: #f9fafb; padding: 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="dashboard-view" class="admin-wrap">
    <h1>SOL LINK A/B Pilot Dashboard</h1>
    <p><a href="index.html">← Back to prototype</a></p>

    <div class="toolbar">
      <button type="button" id="refresh-btn">Refresh</button>
      <button type="button" id="flush-queue-btn">Upload queued (local) sessions</button>
      <button type="button" id="export-csv-btn">Export CSV</button>
      <select id="variant-filter">
        <option value="">All variants</option>
        <option value="A">Type A</option>
        <option value="B">Type B</option>
      </select>
    </div>

    <div class="admin-card stats" id="stats"></div>

    <div class="admin-card">
      <h3>Sessions</h3>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Variant</th>
              <th>Total (s)</th>
              <th>Scroll</th>
              <th>Back</th>
              <th>CTAs</th>
              <th>Section dwell (s)</th>
            </tr>
          </thead>
          <tbody id="sessions-body"></tbody>
        </table>
      </div>
    </div>

    <div class="admin-card">
      <h3>Section dwell averages (seconds)</h3>
      <div id="dwell-chart"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
