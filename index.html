<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0c111d">
  <title>SOL LINK Event</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <button type="button" id="back-btn" class="icon-btn" aria-label="뒤로가기">←</button>
    <h1>이벤트</h1>
    <span id="variant-badge" class="variant-badge"></span>
  </header>

  <main id="main-content"></main>

  <div id="install-banner" class="install-banner hidden">
    <p>전체 화면으로 사용하려면 홈 화면에 추가하세요</p>
    <button type="button" id="dismiss-install">닫기</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const banner = document.getElementById('install-banner');
    const dismissed = localStorage.getItem('install_banner_dismissed');
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    if (!isStandalone && !dismissed) {
      banner.classList.remove('hidden');
    }

    document.getElementById('dismiss-install')?.addEventListener('click', () => {
      banner.classList.add('hidden');
      localStorage.setItem('install_banner_dismissed', '1');
    });
  </script>
</body>
</html>
