<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0c111d">
  <title>SOL LINK Event</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="mobile-shell">
  <header class="figma-top-nav">
    <div class="top-nav-inner">
      <nav class="top-nav-bar" aria-label="이벤트">
        <button type="button" id="back-btn" class="top-nav-back-btn" aria-label="뒤로가기">
          <img src="assets/shared/icon-back.png" alt="" class="top-nav-back-icon">
          <span class="top-nav-title" lang="ko">이벤트</span>
        </button>
        <div class="top-nav-right">
          <button type="button" id="btn-version-info" class="top-nav-icon-btn" aria-label="버전 확인">
            <img src="assets/shared/icon-share.png" alt="">
          </button>
          <button type="button" id="btn-switch-version" class="top-nav-icon-btn" aria-label="버전 전환">
            <img src="assets/shared/icon-chat.png" alt="">
          </button>
          <a href="admin.html" id="btn-admin" class="top-nav-icon-btn" aria-label="관리자">
            <img src="assets/shared/icon-home.png" alt="">
          </a>
        </div>
      </nav>
    </div>
  </header>

  <main id="main-content"></main>

  <div id="install-banner" class="install-banner hidden">
    <p>전체 화면으로 사용하려면 홈 화면에 추가하세요</p>
    <button type="button" id="dismiss-install">닫기</button>
  </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const banner = document.getElementById('install-banner');
    const dismissed = localStorage.getItem('install_banner_dismissed');
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    if (!isStandalone && !dismissed) {
      banner.classList.remove('hidden');
    }

    document.getElementById('dismiss-install')?.addEventListener('click', () => {
      banner.classList.add('hidden');
      localStorage.setItem('install_banner_dismissed', '1');
    });
  </script>
</body>
</html>
